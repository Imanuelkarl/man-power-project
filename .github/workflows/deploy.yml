name: Test SSH with sshpass

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install sshpass
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass
    
    - name: Connect to VPS
      run: |
        sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
          echo "========================================="
          echo "✅ Successfully connected to VPS!"
          echo "========================================="
          echo "Hostname: $(hostname)"
          echo "IP Address: $(hostname -I)"
          echo "Current User: $(whoami)"
          echo "Home Directory: $HOME"
          echo "Current Path: $(pwd)"
          echo "========================================="
          echo "System Information:"
          cat /etc/os-release | grep PRETTY_NAME
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime)"
          echo "========================================="
          echo "Directory contents:"
          ls -la
          echo "========================================="
          echo "Node.js version: $(node --version 2>/dev/null || echo 'Not installed')"
          echo "NPM version: $(npm --version 2>/dev/null || echo 'Not installed')"
          echo "PM2 version: $(pm2 --version 2>/dev/null || echo 'Not installed')"
          echo "========================================="
          echo "✅ Connection test completed successfully!"