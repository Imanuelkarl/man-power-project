name: Deploy Man Power App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and build client
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm install
          npm run build

      - name: Install and build server
        working-directory: server
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

          APP_NAME: ${{ secrets.APP_NAME }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          PASSWORD_RESET_EXPIRES: ${{ secrets.PASSWORD_RESET_EXPIRES }}
        run: |
          npm ci
          echo "DATABASE_URL is ${DATABASE_URL}"
          echo "DATABASE_URL is ${{secrets.DATABASE_URL}}"
          echo "DATABASE_URL is ${{secrets.VITE_API_BASE_URL}}"
          npm run build

      - name: Deploy to Server using SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y sshpass openssh-client
          fi

          # 🛠️ Changed target path to use your user's home folder (~/)
          echo "Creating remote directories in home folder..."
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "mkdir -p ~/deployed/client/dist ~/deployed/server/dist"

          echo "Uploading client files..."
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -r ./client/dist/. ${VPS_USER}@${VPS_HOST}:/var/www/man-power-project/client/dist

          echo "Uploading server files..."
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -r ./server/dist/. ${VPS_USER}@${VPS_HOST}:/var/www/man-power-project/server/dist

      - name: Restart server using SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y sshpass openssh-client
          fi

          # 🛠️ Updated target execution path to match the home folder (~/)
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "cd /var/www/man-power-project/server/dist && sudo pm2 restart all"
